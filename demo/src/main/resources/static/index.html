<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Product Admin</h1>
    <div class="toolbar">
      <input id="search" placeholder="Search products...">
      <button id="btnNew">New Product</button>
    </div>
    <div id="list" class="list"></div>
    <div id="editor" class="editor hidden">
      <h2 id="editorTitle">New Product</h2>
      <form id="form">
        <input name="id" type="hidden">
        <label>Name</label>
        <input name="name" required>
        <label>Short Desc</label>
        <input name="shortDesc">
        <label>Long Desc</label>
        <textarea name="longDesc"></textarea>
        <label>Brand</label>
        <input name="brand">
        <label>Price</label>
        <input name="price">
        <label>Image URL</label>
        <input name="imageUrl">
        <div class="buttons">
          <button type="submit">Save</button>
          <button type="button" id="btnCancel">Cancel</button>
          <button type="button" id="btnDelete" class="danger hidden">Delete</button>
        </div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
